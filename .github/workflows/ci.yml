name: CI Pipeline

on:
  push:
    branches: ["master", "develop", "feature/**"]
  pull_request:
    branches: ["master", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Inference Service (FastAPI) ─────────────────────────────────────────────
  test-inference-service:
    name: "Test · Inference Service"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/inference-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/inference-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inference-test-results
          path: backend/inference-service/test-results.xml

  # ── Model Registry (FastAPI + SQLAlchemy) ───────────────────────────────────
  test-model-registry:
    name: "Test · Model Registry"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/model-registry

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/model-registry/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        env:
          USE_SQLITE: "true"
        run: python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-test-results
          path: backend/model-registry/test-results.xml

  # ── API Gateway (Spring Boot / Maven) ───────────────────────────────────────
  build-api-gateway:
    name: "Build · API Gateway"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn package -DskipTests -q

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: backend/api-gateway/target/*.jar

  # ── React Frontend ──────────────────────────────────────────────────────────
  build-frontend:
    name: "Build · Frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── Docker Build (validates all Dockerfiles) ────────────────────────────────
  docker-build:
    name: "Docker Build · ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs:
      - test-inference-service
      - test-model-registry
      - build-api-gateway
      - build-frontend
    strategy:
      matrix:
        include:
          - service: inference-service
            context: backend/inference-service
          - service: model-registry
            context: backend/model-registry
          - service: api-gateway
            context: backend/api-gateway
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.prod

    steps:
      - uses: actions/checkout@v4

      - name: Download API Gateway JAR
        if: matrix.service == 'api-gateway'
        uses: actions/download-artifact@v4
        with:
          name: api-gateway-jar
          path: backend/api-gateway/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file:    ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          push:    false
          tags:    capstone/${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service }}

  # ── Kubernetes manifest validation ──────────────────────────────────────────
  validate-k8s:
    name: "Validate · Kubernetes Manifests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeval
        run: |
          curl -sLO https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/

      - name: Validate all manifests
        run: |
          find k8s/ -name "*.yaml" | xargs kubeval --ignore-missing-schemas
