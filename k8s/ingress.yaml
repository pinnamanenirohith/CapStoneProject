apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capstone-ingress
  namespace: capstone
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"        # allow model uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"     # long inference timeout
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/rate-limit: "100"             # 100 req/s per IP
    nginx.ingress.kubernetes.io/rate-limit-burst-multiplier: "5"
spec:
  ingressClassName: nginx
  rules:
    # Dashboard / React frontend
    - host: capstone.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

    # API Gateway — all /api/* traffic
    - host: api.capstone.local
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

    # Grafana dashboard
    - host: grafana.capstone.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

    # Prometheus (internal access only — consider restricting in prod)
    - host: prometheus.capstone.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
